<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ByBumle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ByBumle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1013">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --green:#14b25a; --green-d:#0f9a4c; --green-l:#e3f6ea;
  --yellow:#ffc93c; --dark:#0f1013; --bg:#f2f3f5; --card:#fff;
  --text:#14161a; --muted:#6c7178; --line:#e6e8ec; --red:#ef4444;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- LOGIN ---------- */
#login{background:var(--dark);transition:opacity .35s,transform .35s}
#login.out{opacity:0;transform:scale(1.04);pointer-events:none}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:calc(var(--sat) + 30px) 24px 30px}
.hero svg.logo{width:190px;height:150px}
.hero h1{font-size:64px;font-weight:800;margin:6px 0 8px;letter-spacing:-1.5px}
.hero p{margin:0;color:#c9cbd0;font-size:21px;font-weight:600;line-height:1.35}
.panel{background:#f6f7f8;border-radius:30px 30px 0 0;padding:26px 24px calc(var(--sab) + 26px)}
.panel-inner{max-width:520px;margin:0 auto}
.seg{display:flex;background:#e9ebee;border-radius:999px;padding:4px;position:relative}
.seg button{flex:1;padding:13px 10px;border-radius:999px;font-weight:700;color:#4b5058;font-size:17px;transition:.2s;position:relative;z-index:1}
.seg button.on{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(20,178,90,.35)}
.seg.light button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.fields{background:#eceef1;border-radius:20px;margin:18px 0 0;padding:4px 18px}
.field{display:flex;align-items:center;gap:14px;padding:14px 0;color:#6c7178}
.field+.field{border-top:1px solid #dcdfe3}
.field input{flex:1;border:0;background:none;font-size:18px;color:var(--text);outline:none;min-width:0}
.field input::placeholder{color:#8b9097}
.forgot{display:block;text-align:right;color:var(--green);font-weight:600;text-decoration:underline;font-size:15px;padding:4px 0 12px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:999px;font-weight:700;font-size:19px}
.btn.primary{background:var(--green);color:#fff;margin-top:18px;box-shadow:0 6px 16px rgba(20,178,90,.3)}
.btn.primary:active{background:var(--green-d)}
.btn.white{background:#fff;color:#000;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.or{display:flex;align-items:center;gap:14px;color:#8b9097;margin:18px 0;font-size:15px}
.or:before,.or:after{content:"";flex:1;height:1px;background:#dcdfe3}
.anon{text-align:center;color:#7a7f86;font-size:14px;margin-top:16px}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (orientation:landscape) and (min-width:900px){
  #login{flex-direction:row}
  .hero{flex:1.1}
  .panel{flex:1;border-radius:30px 0 0 30px;display:flex;align-items:center;padding:30px 40px}
  .panel-inner{width:100%}
}

/* ---------- MAIN ---------- */
#main{background:var(--bg);opacity:0;transition:opacity .4s}
#main.in{opacity:1}
.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 22px) calc(var(--sar) + 22px) calc(var(--sab) + 120px) calc(var(--sal) + 22px);display:none;animation:fade .25s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:980px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h2{font-size:34px;font-weight:800;margin:0;letter-spacing:-.6px}
.head .sub{color:var(--muted);font-size:16px;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:800;color:#3b2a00;flex:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.bar{height:10px;background:#edf0f2;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .8s}
.sec-title{font-size:22px;font-weight:800;margin:28px 0 12px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{padding:9px 15px;border-radius:999px;background:#fff;font-weight:600;font-size:15px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip.on{background:var(--text);color:#fff}

/* tabbar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);width:min(640px,calc(100% - 28px));
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px;display:flex;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:#8a8f96;font-size:13px;font-weight:600;border-radius:22px}
.tabbar button svg{width:27px;height:27px}
.tabbar button.on{color:var(--green)}
.tabbar button.on svg{fill:currentColor;fill-opacity:.18}

/* I dag */
.ring-card{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:140px;height:140px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c svg{width:28px;height:28px;transform:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.mini div{background:#f5f6f8;border-radius:16px;padding:12px 12px;min-width:0}
.mini b{display:block;font-size:21px;white-space:nowrap}
.mini span{font-size:13px;color:var(--muted);white-space:nowrap}
.week{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:34px;background:#cfeedd;border-radius:9px 9px 4px 4px;transition:height .8s}
.week .today i{background:var(--green)}
.week span{font-size:13px;color:var(--muted);font-weight:600}
.banner{background:linear-gradient(135deg,#0f1013,#2a2d33);color:#fff;border-radius:22px;padding:22px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.banner .em{font-size:44px}
.banner b{font-size:21px;display:block}
.banner p{margin:4px 0 0;color:#c9cbd0}
.banner:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,201,60,.18)}
.faces{display:flex}
.faces span{width:34px;height:34px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.faces span:first-child{margin-left:0}

/* Kort */
#v-kort{padding:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#eef0ea}
.map-panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 108px);width:min(620px,calc(100% - 28px));background:rgba(248,249,250,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:26px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.14)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;background:#fff;border-radius:20px;padding:14px 4px}
.stats3>div{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6px}
.stats3>div+div{border-left:1px solid var(--line)}
.stats3 .ic{width:58px;height:58px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;margin-bottom:8px}
.stats3 .ic svg{width:30px;height:30px}
.stats3 b{font-size:25px;letter-spacing:-.4px}
.stats3 span{color:#4b5058;font-size:15px}
.locbtn{position:absolute;right:calc(var(--sar) + 20px);top:calc(var(--sat) + 20px);width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.map-title{position:absolute;left:calc(var(--sal) + 20px);top:calc(var(--sat) + 20px);background:#fff;border-radius:999px;padding:11px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;gap:8px;align-items:center}
.live{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(20,178,90,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(20,178,90,0)}100%{box-shadow:0 0 0 0 rgba(20,178,90,0)}}
.mk{cursor:pointer}

/* Rangliste */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:12px;margin:10px 0 18px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center}
.pod .avatar{width:64px;height:64px;font-size:22px;margin-bottom:8px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.pod .blk{width:100%;border-radius:18px 18px 8px 8px;margin-top:10px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:30px;font-weight:900;color:#fff}
.pod .nm{font-weight:700;font-size:15px;line-height:1.2;min-height:36px;display:flex;align-items:center}
.pod .pt{color:var(--muted);font-size:14px}
.lb{background:#fff;border-radius:22px;overflow:hidden}
.lb .r{display:flex;align-items:center;gap:14px;padding:14px 18px}
.lb .r+.r{border-top:1px solid var(--line)}
.lb .r.me{background:var(--green-l)}
.lb .n{width:28px;font-weight:800;color:var(--muted);text-align:center}
.lb .avatar{width:42px;height:42px}
.lb .nm{flex:1;font-weight:700}
.lb .nm small{display:block;font-weight:500;color:var(--muted)}
.lb .p{font-weight:800}
.trend{font-size:12px;font-weight:700}

/* Forslag */
.fcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.fcard{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);text-align:left;display:flex;flex-direction:column}
.fimg{height:150px;display:grid;place-items:center;color:#fff;position:relative;background-size:cover;background-position:center}
.fimg svg{width:64px;height:64px;stroke-width:1.6;opacity:.95}
.fimg .pill{position:absolute;left:12px;top:12px;background:#fff}
.fbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.fbody b{font-size:18px;line-height:1.25}
.meta{display:flex;gap:14px;color:var(--muted);font-size:14px;align-items:center;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:17px;height:17px}
.fab{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;font-weight:700;border-radius:999px;padding:12px 18px;box-shadow:0 6px 16px rgba(20,178,90,.3)}

/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,100%);max-height:calc(100% - var(--sat) - 30px);background:#f6f7f8;border-radius:28px 28px 0 0;z-index:41;transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column}
#sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:#cfd2d6;margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 10px}
.sheet-head h3{margin:0;font-size:22px}
.xbtn{width:36px;height:36px;border-radius:50%;background:#e6e8eb;display:grid;place-items:center;color:#555}
.xbtn svg{width:18px;height:18px}
.sheet-body{overflow-y:auto;padding:4px 22px calc(var(--sab) + 26px)}
.timeline{display:flex;gap:4px;margin:14px 0 6px}
.timeline i{flex:1;height:6px;border-radius:9px;background:#dfe2e6}
.timeline i.done{background:var(--green)}
.tl-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:4px}
.tl-labels span{flex:1;text-align:center}
.tl-labels span.cur{color:var(--green);font-weight:800}
.info3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.info3 div{background:#fff;border-radius:16px;padding:12px}
.info3 small{color:var(--muted);display:block;font-size:12px}
.info3 b{font-size:16px}
.vote{display:flex;gap:10px}
.vote .btn{padding:14px}
.btn.outline{background:#fff;border:2px solid var(--line)}
.btn.voted{background:var(--green-l);color:var(--green-d);box-shadow:none}
.cm{display:flex;gap:12px;margin-top:14px}
.cm .avatar{width:38px;height:38px;font-size:14px}
.cm .bub{background:#fff;border-radius:4px 18px 18px 18px;padding:10px 14px;flex:1}
.cm .bub b{font-size:14px}
.cm .bub p{margin:3px 0 0;font-size:15px;line-height:1.4}
.official{background:#e8f1ff;color:#2563eb}
.form label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px;color:#4b5058}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:17px;outline:none;color:var(--text);-webkit-appearance:none;appearance:none}
.form textarea{min-height:90px;resize:none}
.photo{border:2px dashed #cfd2d6;border-radius:16px;height:140px;display:grid;place-items:center;color:var(--muted);background:#fff center/cover no-repeat;position:relative;overflow:hidden;width:100%}
.photo input{position:absolute;inset:0;opacity:0}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.opt button.on{border-color:var(--green);background:var(--green-l)}
.opt b{display:block;font-size:20px}

/* Profil */
.prof{display:flex;align-items:center;gap:18px}
.prof .avatar{width:84px;height:84px;font-size:32px}
.lvl{background:var(--yellow);color:#3b2a00}
.reward{display:flex;align-items:center;gap:14px;padding:14px 0}
.reward+.reward{border-top:1px solid var(--line)}
.reward .em{width:52px;height:52px;border-radius:16px;background:#f5f6f8;display:grid;place-items:center;font-size:28px;flex:none}
.reward .t{flex:1}
.reward .t small{display:block;color:var(--muted)}
.sm{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--green);color:#fff}
.sm.dis{background:#e6e8eb;color:#9aa0a6}
.toggle{width:52px;height:32px;border-radius:99px;background:#d6d9dd;position:relative;transition:.2s;flex:none}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--green)}
.toggle.on:after{left:23px}
.set{display:flex;align-items:center;gap:14px;padding:14px 0}
.set+.set{border-top:1px solid var(--line)}
.set .t{flex:1;font-weight:600}
.set .t small{display:block;font-weight:400;color:var(--muted)}
.wins{display:flex;gap:6px;margin:10px 0}
.wins i{flex:1;height:12px;border-radius:9px;background:#edf0f2}
.wins i.on{background:var(--yellow)}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--sat) + 16px);transform:translate(-50%,-250%);opacity:0;background:var(--text);color:#fff;padding:13px 20px;border-radius:999px;font-weight:600;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;gap:10px;align-items:center;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast svg{color:#4ade80}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login" class="screen">
  <div class="hero">
    <svg class="logo" viewBox="0 0 220 170" aria-hidden="true">
      <path d="M8 150 C 30 120, 70 160, 60 120 S 20 80, 60 70" fill="none" stroke="#14b25a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
      <g transform="translate(130 92) rotate(-14)">
        <ellipse cx="-14" cy="-38" rx="20" ry="32" fill="#fff" opacity=".95" transform="rotate(-25 -14 -38)"/>
        <ellipse cx="12" cy="-40" rx="17" ry="28" fill="#e9eef3" opacity=".95" transform="rotate(18 12 -40)"/>
        <ellipse cx="0" cy="0" rx="56" ry="40" fill="#ffc93c"/>
        <clipPath id="bodyclip"><ellipse cx="0" cy="0" rx="56" ry="40"/></clipPath>
        <g clip-path="url(#bodyclip)" fill="#111">
          <rect x="-34" y="-45" width="14" height="90" rx="4"/>
          <rect x="-6" y="-45" width="14" height="90" rx="4"/>
          <rect x="-62" y="-45" width="10" height="90"/>
        </g>
        <circle cx="38" cy="-6" r="22" fill="#111"/>
        <circle cx="46" cy="-11" r="9" fill="#fff"/>
        <circle cx="48" cy="-11" r="5" fill="#111"/>
        <circle cx="50" cy="-13" r="1.8" fill="#fff"/>
        <path d="M30 -26 Q 34 -46 46 -50 M42 -24 Q 52 -42 64 -42" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
        <path d="M-56 0 l-12 4 l12 4z" fill="#111"/>
      </g>
    </svg>
    <h1>ByBumle</h1>
    <p>Når vi bevæger os sammen,<br>gør vi vores by bedre.</p>
  </div>
  <div class="panel"><div class="panel-inner">
    <div class="seg" id="loginSeg">
      <button class="on" data-m="in">Log ind</button>
      <button data-m="new">Opret konto</button>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="fields">
        <div class="field hidden" id="nameField"><svg class="i"><use href="#i-user"/></svg><input id="name" placeholder="Fornavn" autocapitalize="words"></div>
        <div class="field"><svg class="i"><use href="#i-mail"/></svg><input id="email" type="email" placeholder="E-mail" autocapitalize="off" autocorrect="off"></div>
        <div class="field"><svg class="i"><use href="#i-lock"/></svg><input id="pw" type="password" placeholder="Adgangskode"><button type="button" id="eye" aria-label="Vis adgangskode"><svg class="i"><use href="#i-eye"/></svg></button></div>
        <button type="button" class="forgot" id="forgot">Glemt adgangskode?</button>
      </div>
      <button class="btn primary" id="loginBtn" type="submit">Log ind</button>
    </form>
    <div class="or">eller</div>
    <button class="btn white" id="appleBtn"><svg class="i" style="fill:#000;stroke:none"><use href="#i-apple"/></svg>Fortsæt med Apple</button>
    <div class="anon">Du kan være anonym på ranglisterne</div>
  </div></div>
</section>

<!-- ================= MAIN ================= -->
<section id="main" class="screen hidden">
  <div class="views">
    <div class="view on" id="v-idag"></div>

function doLogin(forced){
  document.activeElement && document.activeElement.blur();
  let nm = forced || $('#name').value.trim();
  if(!nm){
    const em=$('#email').value.trim().split('@')[0].split(/[._\-0-9]/)[0];

  }
  state.name = nm.charAt(0).toUpperCase()+nm.slice(1).toLowerCase();

function animateIdag(){

function seeded(s){return ()=>{s=(s*9301+49297)%233280;return s/233280;};}
function streets(){
  // små kvarterer med parallelle veje
  const D=[[560,300,.15,200,160],[820,300,-.35,200,170],[480,560,.25,220,170],[820,560,.05,240,190],[690,430,-.1,160,120],[380,330,-.2,140,120],[960,420,.4,150,140],[300,560,0,150,120]];
  let out='';
  D.forEach(([cx,cy,a,w,h])=>{
    const c=Math.cos(a), s=Math.sin(a);
    const P=(x,y)=>[(cx+x*c-y*s).toFixed(0),(cy+x*s+y*c).toFixed(0)];
    for(let k=-2;k<=2;k++){ const y=k*h/4.5; const [x1,y1]=P(-w/2,y),[x2,y2]=P(w/2,y); out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
    for(let k=-2;k<=2;k++){ const x=k*w/4.5; const [x1,y1]=P(x,-h/2),[x2,y2]=P(x,h/2); out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
  });
  return out;
}
function blocks(){
  const r=seeded(3); let out='';
  for(let k=0;k<200;k++){
    const a=r()*Math.PI*2, d=Math.sqrt(r()), x=700+Math.cos(a)*380*d, y=470+Math.sin(a)*290*d;
    out+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${(8+r()*14).toFixed(0)}" height="${(8+r()*12).toFixed(0)}" rx="2" transform="rotate(${(r()*40-20).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;
  }
  return out;
}

function setMapMode(m){

let pan={x:0,y:0}, moved=false, upp=1;
function fitMap(){
  const svg=$('#map'); if(!svg) return; const w=svg.clientWidth||innerWidth, h=svg.clientHeight||innerHeight;
  upp=Math.max(900/w,900/h); const W=w*upp, H=h*upp;
  svg.setAttribute('viewBox',`${(700-W/2).toFixed(0)} ${(480-H/2+H*0.06).toFixed(0)} ${W.toFixed(0)} ${H.toFixed(0)}`);
}
addEventListener('resize',fitMap);
function applyPan(anim){const g=$('#mapG'); g.style.transition=anim?'transform .4s':'none'; g.setAttribute('transform',`translate(${pan.x} ${pan.y})`); g.style.transform=`translate(${pan.x}px,${pan.y}px)`;}
function initPan(){
  const svg=$('#map'); let start=null;
  svg.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y}; moved=false;});
  window.addEventListener('pointermove',e=>{
    if(!start) return;
    const sc=upp;
    const dx=(e.clientX-start.x)*sc, dy=(e.clientY-start.y)*sc;
    if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
    pan.x=Math.max(-450,Math.min(450,start.px+dx)); pan.y=Math.max(-350,Math.min(350,start.py+dy)); applyPan(false);
  });
  window.addEventListener('pointerup',()=>{start=null; setTimeout(()=>moved=false,50);});
}

    const t=$('#nfT').value.trim()||'Mit nye forslag';
    const p=$('#nfP').value;
    const f={id:Date.now(),title:t,cat:$('#nfC').value,status:'Idé',votes:1,price:+$('#nfPr').value||10000,place:p.startsWith('Min')?'Tønder centrum':p,by:state.anon?'Anonym Bumle':state.name,days:0,desc:$('#nfD').value.trim()||'Ingen beskrivelse.',comments:[],photo};
    FORSLAG.unshift(f); state.myVotes.add(f.id); fFilter='Alle';
    closeSheet(); renderForslag(); switchView('forslag'); toast('Dit forslag er oprettet!');
  };
}

/* ---------------- PROFIL ---------------- */
const REWARDS=[['🌳','Plant et træ i Tønders navn',1],['🔧','Gratis cykelservice',2],['🎬','2 biografbilletter',3],['⚽','Sportsudstyr (gavekort 300 kr.)',5],['🚌','Gratis busbillet i en måned',4],['🎧','AirPods',10]];
function renderProfil(){
  $('#v-profil').innerHTML=`<div class="wrap">
    <div class="head"><h2>Profil</h2></div>
    <div class="grid">
      <div class="card">
        <div class="prof"><div class="avatar">${initials(state.name)}</div><div><div style="font-size:26px;font-weight:800">${state.name}</div><div class="muted">6.B · Tønder Distriktsskole</div><span class="pill lvl" style="margin-top:8px">🐝 Bumle-niveau 7</span></div></div>
        <div class="mini" style="margin-top:18px;grid-template-columns:repeat(3,1fr)"><div><b>412.880</b><span>skridt i alt</span></div><div><b>286 km</b><span>cyklet i alt</span></div><div><b>${state.wins}</b><span>wins</span></div></div>
      </div>
      <div class="card">
        <h3>🏅 Dine wins</h3>
        <div class="muted">Vind en måned i din gruppe eller klasse og få et win. Indløs dem til præmier.</div>
        <div class="wins">${Array.from({length:10},(_,i)=>`<i class="${i<state.wins?'on':''}"></i>`).join('')}</div>
        <div class="row between"><b>${state.wins} / 10 wins</b><span class="muted">${Math.max(0,10-state.wins)} til AirPods 🎧</span></div>
      </div>
    </div>
    <div class="sec-title">Belønninger</div>
    <div class="card" style="padding-top:6px;padding-bottom:6px">${REWARDS.map((r,i)=>`<div class="reward"><div class="em">${r[0]}</div><div class="t"><b>${r[1]}</b><small>${r[2]} win${r[2]>1?'s':''}</small></div><button class="sm ${state.wins<r[2]?'dis':''}" data-r="${i}">${state.wins<r[2]?'Mangler '+(r[2]-state.wins):'Indløs'}</button></div>`).join('')}</div>
    <div class="sec-title row between" style="display:flex">Mine grupper <button class="sm" id="newG" style="font-size:15px">+ Opret gruppe</button></div>
    <div class="card" style="padding-top:6px;padding-bottom:6px">${state.groups.map(g=>`<div class="reward"><div class="em">${g.emoji}</div><div class="t"><b>${g.name}</b><small>${g.members} medlemmer</small></div>${ic('chev','" style="color:#b0b4ba')}</div>`).join('')}</div>
    <div class="sec-title">Indstillinger</div>
    <div class="card" style="padding-top:4px;padding-bottom:4px">
      <div class="set"><div class="t">Vær anonym på ranglister<small>Dit navn vises som "Anonym Bumle"</small></div><button class="toggle ${state.anon?'on':''}" id="tgAnon"></button></div>
      <div class="set"><div class="t">Forbind til Apple Sundhed<small>Henter skridt og cykelture automatisk</small></div><button class="toggle ${state.health?'on':''}" id="tgHealth"></button></div>
      <div class="set"><div class="t">Dagligt mål<small>10.000 skridt</small></div>${ic('chev','" style="color:#b0b4ba')}</div>
    </div>
    <button class="btn white" id="logout" style="margin-top:22px;color:#ef4444">${ic('logout')} Log ud</button>
    <div class="muted" style="text-align:center;margin-top:18px;font-size:13px">ByBumle v1.0 · Lavet af Malthe, Victor og Johan</div>
  </div>`;
  document.querySelectorAll('#v-profil [data-r]').forEach(b=>b.onclick=()=>{
    const r=REWARDS[+b.dataset.r]; if(state.wins<r[2]){toast(`Du mangler ${r[2]-state.wins} wins`);return;}
    state.wins-=r[2]; renderProfil(); toast(`${r[1]} er indløst! 🎉`);
  });
  $('#tgAnon').onclick=()=>{state.anon=!state.anon; renderProfil(); renderRang(); toast(state.anon?'Du er nu anonym på ranglisterne':'Dit navn vises på ranglisterne');};
  $('#tgHealth').onclick=()=>{state.health=!state.health; renderProfil();};
  $('#newG').onclick=openNewGroup;
  $('#logout').onclick=logout;
}
function openNewGroup(){
  let size=1; const SZ=[['Lille','op til 10',10],['Mellem','op til 25',25],['Stor','op til 50',50]];
  openSheet('Opret gruppe',`<div class="form">
    <label>Gruppens navn</label><input id="ngN" placeholder="Fx: Søndagsgåturen">
    <label>Størrelse</label><div class="opt" id="ngS">${SZ.map((s,i)=>`<button data-i="${i}" class="${i===size?'on':''}"><b>${s[2]} kr.</b>${s[0]}<br><small class="muted">${s[1]}</small></button>`).join('')}</div>
    <div class="muted" style="font-size:14px;margin-top:12px">Det koster lidt at oprette en gruppe, så vi kan holde appen kørende. Overskuddet går til skoler og projekter i kommunen.</div>
    <button class="btn primary" id="ngGo" style="margin-top:20px">${ic('apple','" style="fill:#fff;stroke:none')} Betal med Apple Pay</button>
  </div>`);
  $('#ngS').onclick=e=>{const b=e.target.closest('button'); if(!b) return; size=+b.dataset.i; document.querySelectorAll('#ngS button').forEach(x=>x.classList.toggle('on',x===b));};
  $('#ngGo').onclick=()=>{
    const btn=$('#ngGo'); btn.innerHTML='<div class="spinner"></div>';
    setTimeout(()=>{state.groups.unshift({name:$('#ngN').value.trim()||'Min nye gruppe',members:1,emoji:'✨'}); closeSheet(); renderProfil(); toast('Gruppen er oprettet!');},1000);
  };
}

/* ---------------- SHEET ---------------- */
function openSheet(title,html){$('#sheetTitle').textContent=title; $('#sheetBody').innerHTML=html; $('#sheetBody').scrollTop=0; $('#sheet').classList.add('on'); $('#scrim').classList.add('on');}
function closeSheet(){document.activeElement&&document.activeElement.blur(); $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');}
$('#scrim').onclick=closeSheet; $('#sheetX').onclick=closeSheet;

/* iOS: stop pinch-zoom & double-tap zoom */
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastTouch=0; document.addEventListener('touchend',e=>{const n=Date.now(); if(n-lastTouch<300 && !e.target.closest('input,textarea,select')) e.preventDefault(); lastTouch=n;},{passive:false});

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
